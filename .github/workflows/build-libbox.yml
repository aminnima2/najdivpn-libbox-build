name: build-libbox

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

env:
  CGO_ENABLED: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.10.7
          path: sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKM=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SDKM="$c"; break; fi
          done
          echo "Using sdkmanager: $SDKM"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK; installing r26"
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "ndk;26.1.10909125"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "NDK_DIR=$NDK_DIR"
          ls "$NDK_DIR" | head
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install gomobile (sagernet fork)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build libbox.aar
        working-directory: sing-box
        run: make lib_android

      - name: Show result
        run: ls -la sing-box/libbox.aar

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          if-no-files-found: error
          retention-days: 14

      - name: Release libbox.aar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: libbox-1.10.7
          name: libbox.aar (sing-box 1.10.7)
          files: sing-box/libbox.aar
          make_latest: true
